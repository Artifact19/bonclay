# `docker compose up` starts postgres + backend (CPU) + frontend.
# GPU: `docker compose --profile gpu up postgres backend-gpu frontend`
#      (needs NVIDIA container toolkit; do not run the CPU backend alongside, port clash).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bonclay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonclay_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bonclay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonclay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        BASE_IMAGE: ${BACKEND_BASE_IMAGE:-python:3.11-slim}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bonclay}:${POSTGRES_PASSWORD:-bonclay_dev}@postgres:5432/${POSTGRES_DB:-bonclay}
    volumes:
      - models:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      args:
        BASE_IMAGE: ${BACKEND_GPU_BASE_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bonclay}:${POSTGRES_PASSWORD:-bonclay_dev}@postgres:5432/${POSTGRES_DB:-bonclay}
    volumes:
      - models:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  models:
